# Unified Infrastructure for e-TAMBUA Surveillance System
# - PostgreSQL 16 + pgvector (Database)
# - MinIO (Object Storage)
# - Qdrant (Vector DB for AI Engine)
# - MediaMTX (RTSP/RTMP Stream Relay)
name: tambua

services:
  # --- Backend Services ---
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tambua
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234ayman
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tambua"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tambua-media &&
      mc anonymous set download local/tambua-media
      "

  # --- AI Engine Services ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"        # RTSP <- AI engine / VLC read here
      - "1935:1935"        # RTMP <- OBS pushes here (rtmp://127.0.0.1:1935/live, key "obs")
      - "8888:8888"        # HLS
      - "8889:8889"        # WebRTC (HTTP signaling)
      - "8189:8189/udp"    # WebRTC (UDP media)
      - "9997:9997"        # REST API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  qdrant_data: